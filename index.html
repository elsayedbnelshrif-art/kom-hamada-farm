<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#2f9be8">
<title>مزرعة كوم حمادة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D isometric farm canvas, wooden HUD floats over the sky (top) and on a wooden tray (bottom).
   Palette follows the promo art: deep blue sky, bright grass, red-brown soil, white fence, wood + gold + glossy green UI. */
:root{
  --sky:#2f9be8; --sky2:#9bdcf8; --cream:#fff6d8; --wood:#b9742f; --wood2:#8a4f1c; --woodDark:#5c3310;
  --ink:#3b2410; --clay:#c0392b; --leaf:#3fb321; --leafDark:#1f7d12; --gold:#ffd84a; --goldDark:#c98f12;
  --font:'Cairo',Tahoma,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{height:100%;margin:0;overflow:hidden}
body{background:#1c6fb8;color:var(--ink);font-family:var(--font)}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;
  background:linear-gradient(var(--sky),var(--sky2) 55%,#c9eefc)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-top{position:absolute;top:0;left:0;right:0;padding:8px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud-top>*{pointer-events:auto}
.bar{display:flex;gap:6px;align-items:center}
.pill{background:linear-gradient(#c98743,var(--wood2));border:2px solid var(--woodDark);border-radius:20px;padding:1px 11px;font-weight:900;font-size:15px;color:#ffe98a;text-shadow:0 1px 0 #3b1d05;display:flex;align-items:center;gap:4px;box-shadow:0 3px 0 #3b1d05,inset 0 1px 0 rgba(255,255,255,.35);font-variant-numeric:tabular-nums}
.xp{flex:1;height:18px;background:#5c3310;border:2px solid var(--woodDark);border-radius:10px;overflow:hidden;box-shadow:0 3px 0 #3b1d05;position:relative}
.xp>i{display:block;height:100%;background:linear-gradient(#fff07a,#ffc21a 60%,#f09a00);width:0;transition:width .3s;border-radius:8px}
.hajj{display:flex;gap:8px;align-items:center;background:linear-gradient(#fffbe8,var(--cream));border:3px solid var(--wood);border-radius:16px;padding:4px 8px;font-size:13px;font-weight:800;min-height:54px;box-shadow:0 3px 0 var(--woodDark)}
.hajj .face{width:46px;height:46px;flex:0 0 46px;border-radius:50%;background:linear-gradient(#7fd0ff,#bfeaff);border:2px solid var(--wood);overflow:hidden}
.hajj .face svg{width:100%;height:100%;display:block}
.hajj b{color:var(--clay)}
.hajj #msg{flex:1;min-width:0;line-height:1.35}
.gbtn,.btn,.play{font-family:inherit;font-weight:900;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.35);border:2px solid var(--gold);cursor:pointer;
  background:linear-gradient(#8be84a,var(--leaf) 50%,var(--leafDark));box-shadow:0 4px 0 #14560b,inset 0 2px 0 rgba(255,255,255,.45)}
.gbtn{border-radius:12px;padding:5px 10px;font-size:13px;opacity:.4}
.gbtn.on{opacity:1;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.info{align-self:center;background:rgba(92,51,16,.82);color:#fff3c4;border-radius:12px;padding:1px 12px;font-size:11.5px;font-weight:800;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.hud-bot{position:absolute;bottom:0;left:0;right:0;padding:9px max(10px,env(safe-area-inset-right,0px)) calc(11px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 58px,rgba(60,30,5,.28) 58px 60px),linear-gradient(#c98743,#9a5a22 70%,#7c4416);
  border-top:4px solid var(--woodDark);border-radius:20px 20px 0 0;box-shadow:0 -4px 12px rgba(0,0,0,.25),inset 0 2px 0 rgba(255,255,255,.3)}
.seeds{display:flex;gap:6px;overflow-x:auto;padding:3px 0 8px;scrollbar-width:none}
.seeds::-webkit-scrollbar{display:none}
.seed{flex:0 0 auto;min-width:68px;text-align:center;background:linear-gradient(#fffbe8,var(--cream));border:3px solid #e2c98a;border-radius:13px;padding:2px 4px;font-size:11px;font-weight:800;line-height:1.25;cursor:pointer;box-shadow:0 2px 0 rgba(60,30,5,.5)}
.seed .e{font-size:24px;display:block}
.seed.sel{border-color:var(--gold);background:linear-gradient(#fff7b8,#ffe07a);transform:translateY(-3px);box-shadow:0 0 0 2px #e65100,0 4px 0 rgba(60,30,5,.5)}
.seed.lock{opacity:.6;filter:grayscale(.5)}
.row{display:flex;gap:8px}
.btn{flex:1;font-size:14px;border-radius:14px;padding:7px 6px}
.btn.o{background:linear-gradient(#ffd45a,#f79a14 50%,#d87400);box-shadow:0 4px 0 #8a4a00,inset 0 2px 0 rgba(255,255,255,.45)}
.btn:active,.play:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:focus-visible,.seed:focus-visible,.gbtn:focus-visible,.play:focus-visible{outline:3px solid #fff;outline-offset:2px}
.toast{position:absolute;top:150px;left:50%;transform:translateX(-50%);background:rgba(59,36,16,.93);color:#fff;padding:6px 14px;border-radius:16px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5;white-space:nowrap;border:2px solid var(--gold)}
.toast.show{opacity:1}
.pop{position:absolute;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.3);pointer-events:none;animation:up 1s forwards;z-index:4;transform:translate(-50%,-50%)}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
.hint{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);pointer-events:none;white-space:nowrap}

/* wooden sign (title + level-up) */
.sign{position:relative;background:linear-gradient(#b8763a,#8d5122 60%,#74401a);border:5px solid #5a2f10;border-radius:26px;padding:6px 30px 10px;text-align:center;
  box-shadow:0 8px 0 #3b1d05,0 14px 24px rgba(0,0,0,.35),inset 0 3px 0 rgba(255,255,255,.3);line-height:1.15}
.sign:before,.sign:after{content:"";position:absolute;top:-46px;width:9px;height:46px;background:repeating-linear-gradient(160deg,#9a6a35 0 5px,#6e4520 5px 10px);border-radius:4px}
.sign:before{right:22%}.sign:after{left:22%}
.sign .l1{display:block;font-size:44px;font-weight:900;color:#fff;-webkit-text-stroke:2px #4a240a;paint-order:stroke fill;text-shadow:0 4px 0 #4a240a}
.sign .l2{display:block;font-size:50px;font-weight:900;color:var(--gold);-webkit-text-stroke:2px #4a240a;paint-order:stroke fill;text-shadow:0 4px 0 #4a240a}
.ribbon{position:relative;background:linear-gradient(#e8402f,#b81f17);color:#fff;border-radius:6px;padding:5px 26px 7px;text-align:center;font-weight:900;margin-top:-6px;box-shadow:0 5px 0 #7c120d,0 8px 14px rgba(0,0,0,.3);text-shadow:0 2px 0 rgba(0,0,0,.35)}
.ribbon b{display:block;font-size:21px}
.ribbon span{display:block;font-size:17px;color:var(--gold)}
.ribbon i{font-style:normal;color:#8be84a;font-size:11px;vertical-align:middle;margin:0 4px}
.splash{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:60px 16px 24px;
  background:linear-gradient(rgba(47,155,232,.78),rgba(120,205,250,.45) 45%,rgba(90,190,40,.5));transition:opacity .4s}
.splash.hide{opacity:0;pointer-events:none}
.hero{width:150px;height:150px;filter:drop-shadow(0 8px 10px rgba(0,0,0,.3))}
.hero svg{width:100%;height:100%}
.play{font-size:24px;border-radius:40px;padding:10px 44px;border-width:4px;box-shadow:0 6px 0 #14560b,0 12px 20px rgba(0,0,0,.3),inset 0 3px 0 rgba(255,255,255,.5);animation:pulse 1s infinite alternate}
.lvlup{position:absolute;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(20,60,10,.45);padding:20px}
.lvlup.show{display:flex}
.lvlup .sign{padding:12px 26px 16px;animation:drop .45s cubic-bezier(.3,1.5,.5,1)}
.lvlup .sign:before,.lvlup .sign:after{display:none}
.lvlup .l1{font-size:22px}.lvlup .l2{font-size:36px}
.lvlup p{margin:6px 0 0;color:#fff3c4;font-weight:800;font-size:14px;line-height:1.7}
.lvlup small{display:block;margin-top:8px;color:#ffe98a;font-weight:800;opacity:.85}
@keyframes drop{from{transform:translateY(-60px) scale(.7);opacity:0}}
@media (max-height:620px){.hero{width:100px;height:100px}.sign .l1{font-size:34px}.sign .l2{font-size:40px}}
@media (prefers-reduced-motion:reduce){.gbtn.on,.play{animation:none}.pop{animation-duration:.01s}.lvlup .sign{animation:none}}
</style>
</head>
<body>
<div id="app" dir="rtl">
  <canvas id="cv"></canvas>
  <div class="hud-top" id="hudTop">
    <div class="bar">
      <div class="pill">🪙 <span id="coins">0</span></div>
      <div class="xp"><i id="xpbar"></i></div>
      <div class="pill">⭐ <span id="lvl">1</span></div>
    </div>
    <div class="hajj"><div class="face" id="face"></div><div id="msg">أهلاً بيك في كوم حمادة يا باشا!</div><button id="claim" class="gbtn" type="button">استلم</button></div>
    <div class="info" id="info"></div>
  </div>
  <div class="hint" id="hint">اسحب لتحريك المزرعة · قرّب بإصبعين</div>
  <div class="hud-bot" id="hudBot">
    <div class="seeds" id="seeds"></div>
    <div class="row">
      <button class="btn" id="harvestAll" type="button">🧺 احصد الكل</button>
      <button class="btn o" id="plantAll" type="button">🌱 ازرع الكل</button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <div class="lvlup" id="lvlup"><div class="sign"><span class="l1" id="luA"></span><span class="l2" id="luB"></span><p id="luC"></p><small>دوس للمتابعة</small></div></div>
  <div class="splash" id="splash">
    <div class="sign"><span class="l1">مزرعة</span><span class="l2">كوم حمادة</span></div>
    <div class="ribbon"><b>ابني مزرعتك الخاصة</b><span>ازرع <i>●</i> احصد <i>●</i> اربح</span></div>
    <div class="hero" id="hero"></div>
    <button class="play" id="play" type="button">▶ العب الآن</button>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= GAME DATA ================= */
const CROPS=[
 {id:'wheat',n:'قمح',e:'🌾',lv:1,cost:5,sell:9,t:10},
 {id:'clover',n:'برسيم',e:'🌿',lv:1,cost:8,sell:15,t:20},
 {id:'corn',n:'ذرة',e:'🌽',lv:2,cost:12,sell:24,t:40},
 {id:'tomato',n:'طماطم',e:'🍅',lv:3,cost:20,sell:40,t:70},
 {id:'bean',n:'فول',e:'🫘',lv:4,cost:30,sell:62,t:100},
 {id:'cane',n:'قصب سكر',e:'🎋',lv:5,cost:50,sell:105,t:180},
 {id:'onion',n:'بصل',e:'🧅',lv:6,cost:70,sell:150,t:240},
 {id:'potato',n:'بطاطس',e:'🥔',lv:7,cost:90,sell:195,t:300},
 {id:'cucumber',n:'خيار',e:'🥒',lv:8,cost:115,sell:250,t:360},
 {id:'eggplant',n:'باذنجان',e:'🍆',lv:9,cost:145,sell:320,t:450},
 {id:'pepper',n:'فلفل',e:'🫑',lv:10,cost:180,sell:400,t:540},
 {id:'melon',n:'بطيخ',e:'🍉',lv:12,cost:250,sell:570,t:720},
 {id:'grape',n:'عنب',e:'🍇',lv:14,cost:340,sell:790,t:900},
 {id:'orange',n:'برتقال',e:'🍊',lv:16,cost:450,sell:1060,t:1200},
 {id:'mango',n:'مانجو',e:'🥭',lv:18,cost:600,sell:1430,t:1500},
 {id:'cotton',n:'قطن',e:'☁️',lv:20,cost:800,sell:1930,t:1800},
 {id:'dates',n:'بلح',e:'🌴',lv:22,cost:1050,sell:2560,t:2400},
 {id:'rose',n:'ورد بلدي',e:'🌹',lv:25,cost:1400,sell:3450,t:3000},
 {id:'berry',n:'فراولة',e:'🍓',lv:28,cost:1900,sell:4750,t:3600}
];
const C=Object.fromEntries(CROPS.map(c=>[c.id,c]));
const MAXLV=30, LAND_LV=13; // land grows on every level-up until LAND_LV (10x10)
const TITLES=[[30,'عمدة كوم حمادة'],[25,'كبير الناحية'],[20,'صاحب عزبة'],[15,'شيخ الفلاحين'],[10,'معلّم الغيط'],[5,'فلاح شاطر'],[1,'فلاح جديد']];
const titleOf=l=>TITLES.find(t=>l>=t[0])[1];
const landFor=l=>{const e=Math.min(l,LAND_LV)-1;return{w:4+Math.ceil(e/2),h:4+Math.floor(e/2)}};
const need=l=>Math.round(30*Math.pow(l,1.5)+(l>5?8*Math.pow(l-5,3):0));
const ft=t=>t<60?t+'ث':t<3600?Math.round(t/60)+'د':Math.round(t/360)/10+'س';
const KEY='komHamadaFarm1';
let S,landDirty=false;
function fresh(){return{coins:30,xp:0,lv:1,w:4,h:4,plots:Array(16).fill(null),sel:'wheat',mission:null,last:Date.now()}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&Array.isArray(d.plots)){
   if(d.size&&!d.w){d.w=d.h=d.size;delete d.size} // older saves used a square "size"
   if(!d.w||!d.h||d.plots.length!==d.w*d.h)return fresh();
   d.lv=Math.max(1,Math.min(MAXLV,d.lv|0));if(!C[d.sel])d.sel='wheat';d.plots=d.plots.map(p=>p&&C[p.c]?p:null);return d}}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function ensureLand(){const t=landFor(S.lv),nw=Math.max(S.w,t.w),nh=Math.max(S.h,t.h);if(nw===S.w&&nh===S.h)return false;
 const np=Array(nw*nh).fill(null);for(let y=0;y<S.h;y++)for(let x=0;x<S.w;x++)np[y*nw+x]=S.plots[y*S.w+x];S.plots=np;S.w=nw;S.h=nh;return true}
S=load();ensureLand();
const $=id=>document.getElementById(id);
const HAJJ='<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M6 100Q8 74 50 70Q92 74 94 100Z" fill="#6f7480"/><path d="M28 73Q50 90 72 73L78 100H64L50 86 36 100H22Z" fill="#efe3c2"/><circle cx="25" cy="52" r="6" fill="#dc9a6c"/><circle cx="75" cy="52" r="6" fill="#dc9a6c"/><circle cx="50" cy="50" r="25" fill="#eab183"/><path d="M22 36Q18 8 50 8Q82 8 78 36Q64 26 50 28Q36 26 22 36Z" fill="#f6f3ec"/><path d="M26 30Q48 14 74 24M30 20Q50 10 70 16" fill="none" stroke="#d6d0c2" stroke-width="2.5" stroke-linecap="round"/><ellipse cx="40" cy="46" rx="5" ry="6" fill="#fff"/><ellipse cx="60" cy="46" rx="5" ry="6" fill="#fff"/><circle cx="41" cy="47" r="3" fill="#2a1a0c"/><circle cx="61" cy="47" r="3" fill="#2a1a0c"/><path d="M33 38Q40 33 46 38M54 38Q60 33 67 38" fill="none" stroke="#3b2416" stroke-width="3" stroke-linecap="round"/><ellipse cx="50" cy="55" rx="6" ry="5" fill="#d98f62"/><path d="M40 66Q50 76 60 66Z" fill="#fff" stroke="#7a2e1e" stroke-width="1.5"/><path d="M27 62Q38 53 50 60Q62 53 73 62Q62 69 50 63Q38 69 27 62Z" fill="#3b2416"/></svg>';
$('face').innerHTML=HAJJ;$('hero').innerHTML=HAJJ;

/* ================= 3D SETUP ================= */
const cv=$('cv'), app=$('app');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-5,5,5,-5,0.1,200);
const CAM_OFF=new THREE.Vector3(14,13,14);
const target=new THREE.Vector3(0,0,0);
let zoom=1;

scene.add(new THREE.HemisphereLight(0xffffff,0x9fd060,0.78));
const sun=new THREE.DirectionalLight(0xfff2d0,0.55);
sun.position.set(9,16,5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-18,right:18,top:18,bottom:-18,near:1,far:70});
sun.shadow.bias=-0.0008;
scene.add(sun);scene.add(sun.target);

const M={}; // material cache
const mat=(c,opts)=>{const k=c+(opts?JSON.stringify(opts):'');return M[k]||(M[k]=new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},opts||{})))};
function mesh(geo,color,x=0,y=0,z=0,shadow=true){const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;return m}
const box=(w,h,d)=>new THREE.BoxGeometry(w,h,d);

/* ---- Ground ---- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(120,120),mat(0x6cc22c));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
(function(){const g=new THREE.CircleGeometry(1,7);
 for(let i=0;i<80;i++){const r=3+Math.random()*20,a=Math.random()*Math.PI*2;
  const p=new THREE.Mesh(g,mat(Math.random()<.5?0x5fb424:0x86d93c));p.rotation.x=-Math.PI/2;
  const s=.4+Math.random()*1.2;p.scale.set(s,s*(.6+Math.random()*.6),1);p.position.set(Math.cos(a)*r,0.005,Math.sin(a)*r);p.receiveShadow=true;scene.add(p)}
})();

/* ---- Decor: the Egyptian village around the field (re-positioned whenever the field grows) ---- */
const decor=new THREE.Group();scene.add(decor);
function palm(h=2.6){const g=new THREE.Group();
 for(let i=0;i<6;i++){const seg=mesh(new THREE.CylinderGeometry(.11,.14,h/6,6),i%2?0x9a6b3c:0x7f5630,0,h/12+i*h/6,0);g.add(seg)}
 for(let i=0;i<8;i++){const leaf=mesh(new THREE.ConeGeometry(.22,1.6,4),i%2?0x2fa32c:0x45bd35,0,h,0);
  leaf.geometry.translate(0,.8,0);leaf.rotation.set(1.2,i*Math.PI/4,0,'YXZ');leaf.scale.set(1,1,.35);g.add(leaf)}
 for(let i=0;i<4;i++){g.add(mesh(new THREE.SphereGeometry(.09,6,5),0xb5541c,Math.cos(i*1.6)*.15,h-.12,Math.sin(i*1.6)*.15))}
 decor.add(g);return g}
function house(){const g=new THREE.Group();
 g.add(mesh(box(3,1.6,2.2),0xf6dd96,0,.8,0));
 g.add(mesh(box(3.06,.3,2.26),0xc94a3a,0,.15,0,false));
 g.add(mesh(box(3.2,.16,2.4),0xe2b662,0,1.68,0));
 g.add(mesh(new THREE.SphereGeometry(.62,12,6,0,Math.PI*2,0,Math.PI/2),0xfafafa,-.6,1.76,-.2));
 g.add(mesh(box(.6,.4,.5),0xecc63e,.75,1.96,-.3));g.add(mesh(box(.5,.35,.45),0xe0b830,.85,2.3,-.25));
 g.add(mesh(box(.6,1.05,.06),0x1e88c9,.6,.53,1.11));
 g.add(mesh(box(.45,.4,.06),0x1e88c9,-.7,1.0,1.11));
 g.add(mesh(box(.06,.4,.45),0x1e88c9,1.51,1.0,0));
 decor.add(g);return g}
function stall(){const g=new THREE.Group();
 g.add(mesh(box(1.9,.6,.8),0x9c5a2e,0,.3,0));
 g.add(mesh(box(2,.08,.9),0xb9742f,0,.64,0));
 [[-.9,-.35],[.9,-.35],[-.9,.35],[.9,.35]].forEach(([x,z])=>g.add(mesh(box(.08,1.5,.08),0x7a4a22,x,.75,z)));
 const aw=new THREE.Group();[0x1e88e5,0xffffff,0xffd23a,0xe53935,0xffffff,0x1e88e5].forEach((c,i)=>aw.add(mesh(box(.36,.06,1.25),c,-.9+i*.36,0,0)));
 aw.position.set(0,1.5,.15);aw.rotation.x=.3;g.add(aw);
 [[-.5,0xe53935],[0,0xffc93c],[.5,0x8bc34a]].forEach(([x,c])=>g.add(mesh(box(.3,.18,.3),c,x,.77,.1,false)));
 decor.add(g);return g}
function pen(){const g=new THREE.Group(),W=3.6,Dp=2.6;g.userData.chickens=[];
 g.add(mesh(box(W,.05,Dp),0xead49a,0,.025,0,false));
 for(let x=-W/2;x<=W/2+.01;x+=.6){g.add(mesh(box(.09,.5,.09),0xb5482f,x,.25,-Dp/2));g.add(mesh(box(.09,.5,.09),0xb5482f,x,.25,Dp/2))}

/* ---- Camera framing (fits the field in the space between the HUD panels) ---- */
function fitCamera(){
 const W=app.clientWidth,H=app.clientHeight;renderer.setSize(W,H,false);
 const t=$('hudTop').offsetHeight+16,b=$('hudBot').offsetHeight+22;$('hint').style.bottom=(b-14)+'px';$('toast').style.top=(t+4)+'px';
 const L=(S.w+S.h)/2*STEP+1.6, hw=L*.72+.3, hh=L*.42+.9;
 const mid=Math.max(120,H-t-b);
 const upp=Math.max(2*hh/mid,2*hw/W)/zoom;
 cam.left=-W/2*upp;cam.right=W/2*upp;cam.top=(mid/2+t)*upp;cam.bottom=-(mid/2+b)*upp;
 cam.updateProjectionMatrix();cam.userData.upp=upp;placeCam()}
function placeCam(){cam.position.copy(target).add(CAM_OFF);cam.lookAt(target)}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const ptrs=new Map();let drag=null,pinch0=0,zoom0=1,moved=false;
cv.addEventListener('pointerdown',e=>{try{cv.setPointerCapture(e.pointerId)}catch(_){}ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,t:target.clone()};moved=false}
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y)||1;zoom0=zoom;moved=true}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoom=Math.min(2.2,Math.max(.5,zoom0*d/pinch0));fitCamera();return}
 if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)moved=true;if(!moved)return;
 const u=cam.userData.upp,r=new THREE.Vector3(1,0,-1).normalize(),f=new THREE.Vector3(-1,0,-1).normalize();
 target.copy(drag.t).addScaledVector(r,-dx*u).addScaledVector(f,dy*u/0.68);
 target.x=Math.max(-12,Math.min(12,target.x));target.z=Math.max(-14,Math.min(10,target.z));placeCam()});
function up(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(!had)return;
 if(ptrs.size===0){if(!moved)pick(e.clientX,e.clientY);drag=null}else{drag=null;moved=true}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(2.2,Math.max(.5,zoom*(e.deltaY<0?1.1:.9)));fitCamera()},{passive:false});
function pick(x,y){const r=cv.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);
 ray.setFromCamera(ndc,cam);const hits=ray.intersectObjects(field.children,true);
 for(const h of hits){let o=h.object;while(o&&o.userData.i===undefined)o=o.parent;if(o){tap(o.userData.i,x-r.left,y-r.top);return}}}

/* ================= GAME LOGIC ================= */
function toast(t,ms){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),ms||1600)}
function pop(txt,x,y){const p=document.createElement('div');p.className='pop';p.textContent=txt;p.style.left=x+'px';p.style.top=y+'px';app.appendChild(p);setTimeout(()=>p.remove(),1000)}
function screenOf(i){const v=plotPos(i);v.y=.6;v.project(cam);return{x:(v.x+1)/2*app.clientWidth,y:(1-v.y)/2*app.clientHeight}}
function newMission(){const ok=CROPS.filter(c=>c.lv<=S.lv);const c=ok[Math.floor(Math.random()*ok.length)];const n=Math.min(3+S.lv,20);S.mission={crop:c.id,n,done:0,reward:Math.round(n*c.sell*1.5)}}
function addXp(a){S.xp+=a;let from=S.lv,bonus=0;
 while(S.lv<MAXLV&&S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;bonus+=S.lv*25}
 if(S.lv>=MAXLV)S.xp=Math.min(S.xp,need(MAXLV));
 if(S.lv>from){S.coins+=bonus;const grew=ensureLand();if(grew)landDirty=true;
  const nc=CROPS.filter(c=>c.lv>from&&c.lv<=S.lv).map(c=>c.n+' '+c.e).join('، ');
  $('luA').textContent='مبروك! مستوى '+S.lv;$('luB').textContent=titleOf(S.lv);
  $('luC').innerHTML=(grew?'🌾 الأرض كبرت وبقت '+S.w+'×'+S.h+'<br>':'')+(nc?'🆕 محصول جديد: '+nc+'<br>':'')+'🎁 هدية: '+bonus+' 🪙';
  $('lvlup').classList.add('show');clearTimeout(addXp.h);addXp.h=setTimeout(()=>$('lvlup').classList.remove('show'),4500)}}
$('lvlup').onclick=()=>$('lvlup').classList.remove('show');
function stage(p){if(!p)return null;const c=C[p.c];const el=(Date.now()-p.t)/1000;return{c,pr:Math.min(1,el/c.t),left:Math.max(0,Math.ceil(c.t-el))}}
function syncPlots(){
 plotObjs.forEach((o,i)=>{const p=S.plots[i],s=stage(p);
  const st=!s?-1:s.pr>=1?2:s.pr<.35?0:1;const key=p?p.c+st:'';
  if(key!==o.key){o.key=key;if(o.crop){o.g.remove(o.crop);o.crop=null}
   if(p){o.crop=buildCrop(p.c,st);o.crop.position.y=.16;o.g.add(o.crop)}
   o.soil.material.color.setHex(p?SOIL_WET:SOIL_DRY);o.fm.color.setHex(p?FURROW_WET:FURROW_DRY);
   o.coin.visible=st===2;if(st===2&&o.crop){o.crop.scale.set(.2,.2,.2);o.grow=0}}
  o.bar.visible=!!s&&s.pr<1;if(o.bar.visible)o.bar.userData.fg.scale.x=Math.max(.02,s.pr)})}
function renderTop(){$('coins').textContent=S.coins;$('lvl').textContent=S.lv;$('xpbar').style.width=(S.lv>=MAXLV?100:S.xp/need(S.lv)*100)+'%';
 $('info').textContent='🏅 '+titleOf(S.lv)+' · 🌾 الأرض '+S.w+'×'+S.h+(S.lv<LAND_LV?' · هتكبر في مستوى '+(S.lv+1):S.lv>=MAXLV?' · أعلى مستوى 👑':' · أقصى مساحة ✅');
 const m=S.mission;if(m){const c=C[m.crop];$('msg').innerHTML='طلب الحاج حمادة: احصد <b>'+m.n+' '+c.n+' '+c.e+'</b> ('+Math.min(m.done,m.n)+'/'+m.n+') والجايزة <b>'+m.reward+'🪙</b>';$('claim').className='gbtn'+(m.done>=m.n?' on':'')}}
function renderSeeds(){const b=$('seeds');b.innerHTML='';
 CROPS.forEach(c=>{const d=document.createElement('div');const lock=c.lv>S.lv;d.className='seed'+(S.sel===c.id?' sel':'')+(lock?' lock':'');d.tabIndex=0;
  d.innerHTML='<span class="e">'+(lock?'🔒':c.e)+'</span>'+c.n+'<br>'+(lock?'مستوى '+c.lv:c.cost+'🪙 · '+ft(c.t));
  d.onclick=()=>{if(lock){toast('بتتفتح في مستوى '+c.lv);return}S.sel=c.id;save();renderSeeds()};b.appendChild(d)})}
function leftTxt(s){return s.left<60?s.left+' ثانية':Math.ceil(s.left/60)+' دقيقة'}
function tap(i,x,y){const p=S.plots[i];const o=plotObjs[i];if(!o)return;o.bounce=1;
 if(!p){const c=C[S.sel];if(c.lv>S.lv)return toast('لسه مفتحتش');if(S.coins<c.cost)return toast('الفلوس مش كفاية 🪙');
  S.coins-=c.cost;S.plots[i]={c:c.id,t:Date.now()};pop('-'+c.cost+'🪙',x,y-20)}
 else{const s=stage(p);if(s.pr<1)return toast('باقي '+leftTxt(s)+' '+s.c.e);harvest(i,{x,y})}
 after()}
function harvest(i,r,quiet){const p=S.plots[i];const c=C[p.c];const q=quiet?null:(r||screenOf(i));S.plots[i]=null;S.coins+=c.sell;addXp(Math.max(1,Math.round(c.sell/3)));
 if(S.mission&&S.mission.crop===c.id)S.mission.done++;if(q)pop('+'+c.sell+'🪙',q.x,q.y-20)}
function after(){if(landDirty){landDirty=false;buildField()}save();syncPlots();renderTop();renderSeeds()}
$('harvestAll').onclick=()=>{let n=0,sum=0;const len=S.plots.length;for(let i=0;i<len;i++){const p=S.plots[i];if(p&&stage(p).pr>=1){sum+=C[p.c].sell;harvest(i,null,n>=10);n++}}
 toast(n?'اتحصد '+n+' محصول 🧺 +'+sum+'🪙':'مفيش حاجة جاهزة لسه');after()};
$('plantAll').onclick=()=>{const c=C[S.sel];if(c.lv>S.lv)return toast('لسه مفتحتش');let n=0;const now=Date.now();
 for(let i=0;i<S.plots.length&&S.coins>=c.cost;i++){if(!S.plots[i]){S.coins-=c.cost;S.plots[i]={c:c.id,t:now};n++}}
 toast(n?'اتزرع '+n+' '+c.n+' '+c.e:(S.plots.some(p=>!p)?'الفلوس مش كفاية 🪙':'مفيش أرض فاضية'));after()};
$('claim').onclick=()=>{const m=S.mission;if(m&&m.done>=m.n){S.coins+=m.reward;toast('تسلم إيدك! +'+m.reward+'🪙');addXp(m.n*3);newMission();after()}};
$('play').onclick=()=>{$('splash').classList.add('hide');setTimeout(()=>{$('hint').style.transition='opacity 1s';$('hint').style.opacity=0},6000)};

/* ================= LOOP ================= */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;
 if(acc>.4){acc=0;syncPlots()}
 const t=now/1000;
 plotObjs.forEach((o,i)=>{
  if(o.coin.visible){o.coin.rotation.z=t*3;o.coin.position.y=1.5+Math.sin(t*3+i)*.08}
  if(o.crop&&o.grow!==undefined&&o.grow<1){o.grow=Math.min(1,o.grow+dt*3);const s=.2+.8*(1-Math.pow(1-o.grow,3))+Math.sin(o.grow*Math.PI)*.15;o.crop.scale.set(s,s,s)}
  if(o.crop&&o.key.endsWith('2')&&!reduce)o.crop.rotation.z=Math.sin(t*1.6+i*.7)*.03;
  if(o.bounce){o.bounce=Math.max(0,o.bounce-dt*4);const s=1+Math.sin(o.bounce*Math.PI)*.08;o.g.scale.set(s,1,s)}
  if(o.bar.visible)o.bar.quaternion.copy(cam.quaternion)});
 if(!reduce){D.wheel.userData.wheel.rotation.z+=dt*.8;D.buff.position.y=Math.abs(Math.sin(t*1.2))*.02;
  D.pen.userData.chickens.forEach((c,k)=>{c.position.y=Math.abs(Math.sin(t*3+k*1.7))*.05;c.rotation.y+=Math.sin(t*.7+k)*dt*.6});
  clouds.forEach((c,k)=>{c.position.x+=dt*(.25+k*.08);if(c.position.x>20)c.position.x=-20});
  D.canal.userData.water.material.color.setHSL(.56,.82,.54+Math.sin(t*1.5)*.02)}
 renderer.render(scene,cam);requestAnimationFrame(loop)}

if(!S.mission||!C[S.mission.crop])newMission();
renderTop();renderSeeds();buildField();syncPlots();save();
window.addEventListener('resize',fitCamera);
if(window.ResizeObserver)new ResizeObserver(fitCamera).observe(app);
requestAnimationFrame(loop);
</script>
</body>
