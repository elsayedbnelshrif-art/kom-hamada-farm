<title>مزرعة كوم حمادة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: full-screen 3D isometric farm canvas, HUD floats over the sky (top) and on a wooden tray (bottom). Single bright daytime look. */
:root{
  --sky:#9fdcf3; --cream:#fff8e1; --wood:#c99a3c; --woodDark:#8a6420;
  --ink:#3b2a14; --clay:#b3541e; --leaf:#43a047; --leafDark:#2b7a30;
  --orange:#f57c00; --orangeDark:#b85a00;
  --font:'Cairo',Tahoma,'Segoe UI',sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{height:100%;overflow:hidden}
body{background:var(--sky);color:var(--ink);font-family:var(--font)}
#app{position:relative;height:100%;max-width:560px;margin:0 auto;overflow:hidden;
  background:linear-gradient(var(--sky),#d8f1fa 60%)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud-top{position:absolute;top:0;left:0;right:0;padding:8px max(10px,env(safe-area-inset-right,0px)) 0 max(10px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:6px;pointer-events:none}
.hud-top>*{pointer-events:auto}
.bar{display:flex;gap:6px;align-items:center}
.pill{background:var(--cream);border:2px solid var(--wood);border-radius:20px;padding:1px 10px;font-weight:900;font-size:15px;display:flex;align-items:center;gap:4px;box-shadow:0 2px 0 var(--woodDark);font-variant-numeric:tabular-nums}
.xp{flex:1;height:16px;background:var(--cream);border:2px solid var(--wood);border-radius:10px;overflow:hidden}
.xp>i{display:block;height:100%;background:linear-gradient(#ffd54f,#ffb300);width:0;transition:width .3s}
.hajj{display:flex;gap:8px;align-items:center;background:rgba(255,253,243,.95);border:2px solid var(--wood);border-radius:14px;padding:5px 10px;font-size:13px;font-weight:700;min-height:50px;box-shadow:0 3px 0 rgba(138,100,32,.5)}
.hajj .face{font-size:30px;line-height:1}
.hajj b{color:var(--clay)}
.hajj #msg{flex:1;min-width:0}
.hajj button{font-family:inherit;font-weight:900;background:var(--leaf);color:#fff;border:0;border-radius:10px;padding:6px 10px;box-shadow:0 3px 0 var(--leafDark);opacity:.4;font-size:13px}
.hajj button.on{opacity:1;animation:pulse 1s infinite alternate}
@keyframes pulse{to{transform:scale(1.08)}}
.hud-bot{position:absolute;bottom:0;left:0;right:0;padding:8px max(10px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(10px,env(safe-area-inset-left,0px));
  background:linear-gradient(#e3b866,#c9933f);border-top:4px solid var(--woodDark);border-radius:18px 18px 0 0;box-shadow:0 -3px 10px rgba(0,0,0,.15)}
.seeds{display:flex;gap:6px;overflow-x:auto;padding-bottom:7px;scrollbar-width:none}
.seeds::-webkit-scrollbar{display:none}
.seed{flex:0 0 auto;min-width:66px;text-align:center;background:var(--cream);border:3px solid #e8d6a6;border-radius:12px;padding:2px 4px;font-size:11px;font-weight:800;line-height:1.25;cursor:pointer}
.seed .e{font-size:24px;display:block}
.seed.sel{border-color:#e65100;background:#ffe2b0;transform:translateY(-3px)}
.seed.lock{opacity:.5}
.row{display:flex;gap:8px}
.btn{flex:1;font-family:inherit;font-weight:900;font-size:14px;border:0;border-radius:12px;padding:8px 6px;color:#fff;background:var(--orange);box-shadow:0 4px 0 var(--orangeDark);cursor:pointer}
.btn.g{background:var(--leaf);box-shadow:0 4px 0 var(--leafDark)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.2)}
.btn:focus-visible,.seed:focus-visible,.hajj button:focus-visible{outline:3px solid #1565c0;outline-offset:2px}
.toast{position:absolute;top:130px;left:50%;transform:translateX(-50%);background:rgba(59,42,20,.92);color:#fff;padding:6px 14px;border-radius:16px;font-weight:800;font-size:14px;opacity:0;pointer-events:none;transition:opacity .25s;z-index:5;white-space:nowrap}
.toast.show{opacity:1}
.pop{position:absolute;font-weight:900;font-size:18px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.55),0 0 6px rgba(0,0,0,.3);pointer-events:none;animation:up 1s forwards;z-index:4;transform:translate(-50%,-50%)}
@keyframes up{to{transform:translate(-50%,-160%);opacity:0}}
.hint{position:absolute;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700;color:rgba(59,42,20,.6);pointer-events:none;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.hajj button.on{animation:none}.pop{animation-duration:.01s}}
</style>

<div id="app" dir="rtl">
  <canvas id="cv"></canvas>
  <div class="hud-top" id="hudTop">
    <div class="bar">
      <div class="pill">🪙 <span id="coins">0</span></div>
      <div class="xp"><i id="xpbar"></i></div>
      <div class="pill">⭐ <span id="lvl">1</span></div>
    </div>
    <div class="hajj"><div class="face">👳</div><div id="msg">أهلاً بيك في كوم حمادة يا باشا!</div><button id="claim" type="button">استلم</button></div>
  </div>
  <div class="hint" id="hint">اسحب لتحريك المزرعة · قرّب بإصبعين</div>
  <div class="hud-bot" id="hudBot">
    <div class="seeds" id="seeds"></div>
    <div class="row">
      <button class="btn g" id="harvestAll" type="button">🧺 احصد الكل</button>
      <button class="btn" id="expand" type="button"></button>
    </div>
  </div>
  <div class="toast" id="toast"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* ================= GAME DATA ================= */
const CROPS=[
 {id:'wheat',n:'قمح',e:'🌾',lv:1,cost:5,sell:9,t:10},
 {id:'clover',n:'برسيم',e:'🌿',lv:1,cost:8,sell:15,t:20},
 {id:'corn',n:'ذرة',e:'🌽',lv:2,cost:12,sell:24,t:40},
 {id:'tomato',n:'طماطم',e:'🍅',lv:3,cost:20,sell:40,t:70},
 {id:'bean',n:'فول',e:'🫘',lv:4,cost:30,sell:62,t:100},
 {id:'cane',n:'قصب سكر',e:'🎋',lv:5,cost:50,sell:105,t:180}
];
const C=Object.fromEntries(CROPS.map(c=>[c.id,c]));
const KEY='komHamadaFarm1';
let S;
function fresh(){return{coins:30,xp:0,lv:1,size:4,plots:Array(16).fill(null),sel:'wheat',mission:null,last:Date.now()}}
function load(){try{const r=localStorage.getItem(KEY);if(r){const d=JSON.parse(r);if(d&&d.plots)return d}}catch(e){}return fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
S=load();
const need=l=>Math.round(30*Math.pow(l,1.5));
const $=id=>document.getElementById(id);

/* ================= 3D SETUP ================= */
const cv=$('cv'), app=$('app');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
const scene=new THREE.Scene();
const cam=new THREE.OrthographicCamera(-5,5,5,-5,0.1,200);
const CAM_OFF=new THREE.Vector3(14,13,14);
const target=new THREE.Vector3(0,0,0);
let zoom=1;

scene.add(new THREE.HemisphereLight(0xfff4d6,0x6b8f2e,0.8));
const sun=new THREE.DirectionalLight(0xffffff,0.9);
sun.position.set(9,16,5);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-16,right:16,top:16,bottom:-16,near:1,far:60});
sun.shadow.bias=-0.0008;
scene.add(sun);scene.add(sun.target);

const M={}; // material cache
const mat=(c,opts)=>{const k=c+(opts?JSON.stringify(opts):'');return M[k]||(M[k]=new THREE.MeshLambertMaterial(Object.assign({color:c,flatShading:true},opts||{})))};
function mesh(geo,color,x=0,y=0,z=0,shadow=true){const m=new THREE.Mesh(geo,mat(color));m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;return m}

/* ---- Ground ---- */
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,90),mat(0x8cc84b));
ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
// grass patches for texture
(function(){const g=new THREE.CircleGeometry(1,7);
 for(let i=0;i<70;i++){const r=6+Math.random()*16,a=Math.random()*Math.PI*2;
  const p=new THREE.Mesh(g,mat(Math.random()<.5?0x7fbb40:0x9bd35a));p.rotation.x=-Math.PI/2;
  const s=.4+Math.random()*1.2;p.scale.set(s,s*(.6+Math.random()*.6),1);p.position.set(Math.cos(a)*r,0.005,Math.sin(a)*r);p.receiveShadow=true;scene.add(p)}
 // tiny flowers
 const fg=new THREE.IcosahedronGeometry(0.06,0);
 for(let i=0;i<60;i++){const r=6.2+Math.random()*12,a=Math.random()*Math.PI*2;
  scene.add(mesh(fg,[0xffffff,0xffeb3b,0xff8a80][i%3],Math.cos(a)*r,0.05,Math.sin(a)*r,false))}
})();

/* ---- Decor: the Egyptian village around the field ---- */
const decor=new THREE.Group();scene.add(decor);
function palm(x,z,h=2.6){const g=new THREE.Group();
 for(let i=0;i<6;i++){const seg=mesh(new THREE.CylinderGeometry(.11,.14,h/6,6),i%2?0x8d6e45:0x7a5c38,0,h/12+i*h/6,0);seg.rotation.z=i*0.02;g.add(seg)}
 for(let i=0;i<7;i++){const leaf=mesh(new THREE.ConeGeometry(.2,1.5,4),0x3f9b3a,0,h,0);
  leaf.geometry.translate(0,.75,0);leaf.rotation.set(1.15,i*Math.PI*2/7,0,'YXZ');leaf.scale.set(1,1,.35);g.add(leaf)}
 for(let i=0;i<4;i++){g.add(mesh(new THREE.SphereGeometry(.09,6,5),0xb5541c,Math.cos(i*1.6)*.15,h-.12,Math.sin(i*1.6)*.15))}
 g.position.set(x,0,z);decor.add(g);return g}
function house(x,z){const g=new THREE.Group();
 g.add(mesh(new THREE.BoxGeometry(3,1.7,2.2),0xe9c99a,0,.85,0));
 g.add(mesh(new THREE.BoxGeometry(3.2,.18,2.4),0xd2a86e,0,1.78,0));
 // rooftop: low wall + straw bundles (Egyptian flat roof)
 g.add(mesh(new THREE.BoxGeometry(1,.4,.8),0xe2c26c,.7,2.05,-.3));
 {const st=mesh(new THREE.CylinderGeometry(.18,.18,1.2,6),0xd9b44a,-.6,1.98,.4);st.rotation.z=Math.PI/2;g.add(st)}
 const door=mesh(new THREE.BoxGeometry(.6,1.05,.06),0x2f6fa8,.6,.53,1.11);g.add(door);
 g.add(mesh(new THREE.BoxGeometry(.45,.4,.06),0x2f6fa8,-.7,1.05,1.11));
 g.add(mesh(new THREE.BoxGeometry(.06,.4,.45),0x2f6fa8,1.51,1.05,0));
 g.position.set(x,0,z);g.rotation.y=Math.PI/4;decor.add(g)}
function pigeonTower(x,z){const g=new THREE.Group();
 g.add(mesh(new THREE.CylinderGeometry(.5,.75,2.4,10),0xf2e6cf,0,1.2,0));
 g.add(mesh(new THREE.ConeGeometry(.55,.9,10),0xe3d3b4,0,2.85,0));
 for(let i=0;i<10;i++){const a=i/10*Math.PI*2,y=1.2+(i%3)*.45;g.add(mesh(new THREE.BoxGeometry(.1,.1,.05),0x5d4037,Math.cos(a)*.6,y,Math.sin(a)*.6,false))}
 g.position.set(x,0,z);decor.add(g)}
function buffalo(x,z,ry){const g=new THREE.Group(),col=0x3a3a3f;
 g.add(mesh(new THREE.BoxGeometry(1.1,.55,.55),col,0,.65,0));
 g.add(mesh(new THREE.BoxGeometry(.4,.38,.38),col,.7,.78,0));
 g.add(mesh(new THREE.BoxGeometry(.18,.12,.3),0x55555c,.92,.7,0));
 const h1=mesh(new THREE.TorusGeometry(.18,.04,4,8,Math.PI),0xd9cfb8,.7,1.02,.12);h1.rotation.y=Math.PI/2;g.add(h1);
 const h2=mesh(new THREE.TorusGeometry(.18,.04,4,8,Math.PI),0xd9cfb8,.7,1.02,-.12);h2.rotation.y=Math.PI/2;g.add(h2);
 [[.4,.18],[.4,-.18],[-.4,.18],[-.4,-.18]].forEach(([a,b])=>g.add(mesh(new THREE.BoxGeometry(.14,.4,.14),col,a,.2,b)));
 g.position.set(x,0,z);g.rotation.y=ry;decor.add(g);return g}
function hay(x,z){const g=new THREE.Group();
 g.add(mesh(new THREE.CylinderGeometry(.75,.9,.9,9),0xe0b94f,0,.45,0));
 g.add(mesh(new THREE.ConeGeometry(.78,.7,9),0xd4ab40,0,1.25,0));g.position.set(x,0,z);decor.add(g)}
function canal(){ // the irrigation canal (ترعة) with banks and a small bridge
 const w=mesh(new THREE.BoxGeometry(60,.05,1.5),0x4fb3e0,0,.02,0,false);w.material=new THREE.MeshLambertMaterial({color:0x4fb3e0});
 const g=new THREE.Group();g.add(w);
 g.add(mesh(new THREE.BoxGeometry(60,.12,.25),0xa8814f,0,.06,.85,false));
 g.add(mesh(new THREE.BoxGeometry(60,.12,.25),0xa8814f,0,.06,-.85,false));
 const br=mesh(new THREE.BoxGeometry(1.3,.14,2.2),0x8b5e34,2.5,.2,0);g.add(br);
 [-.6,.6].forEach(dx=>g.add(mesh(new THREE.BoxGeometry(.08,.35,2.2),0x6d4521,2.5+dx,.4,0)));
 // reeds
 for(let i=0;i<14;i++){const r=mesh(new THREE.ConeGeometry(.07,.7,4),0x6a9f2e,-12+i*1.9+Math.random(),.35,(i%2?1:-1)*1.0);decor.add(r);g.add(r)}
 g.position.set(0,0,-8.6);g.rotation.y=0;decor.add(g);canalWater=w}
let canalWater;
function waterwheel(x,z){const g=new THREE.Group();
 const wh=new THREE.Mesh(new THREE.TorusGeometry(.8,.09,6,14),mat(0x7a5530));wh.castShadow=true;
 for(let i=0;i<6;i++){const s=mesh(new THREE.BoxGeometry(.06,1.6,.08),0x6d4521);s.rotation.z=i*Math.PI/6;wh.add(s)}
 wh.position.y=.9;g.add(wh);g.userData.wheel=wh;
 g.add(mesh(new THREE.BoxGeometry(.12,1.1,.12),0x5d3d1e,0,.55,-.3));g.add(mesh(new THREE.BoxGeometry(.12,1.1,.12),0x5d3d1e,0,.55,.3));
 g.rotation.y=Math.PI/2;g.position.set(x,0,z);decor.add(g);return g}
function cloud(x,z){const g=new THREE.Group();
 [[0,0,0,.9],[.8,-.1,.1,.7],[-.8,-.15,0,.65],[.3,.35,0,.6]].forEach(([a,b,c,r])=>{const s=new THREE.Mesh(new THREE.IcosahedronGeometry(r,1),new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true}));s.position.set(a,b,c);s.castShadow=true;g.add(s)});
 g.position.set(x,9,z);scene.add(g);return g}

canal();
house(-2.5,-12.2);pigeonTower(-7.5,-11.5);
palm(-9.5,-6.5,3);palm(-10.5,-3,2.6);palm(6.5,-11.2,3.1);palm(10,-7,2.7);palm(-8,4.5,2.4);palm(9.5,5,2.9);
const buff=buffalo(8.3,-2,-.6);hay(-8.5,0.5);hay(-9.6,1.8);
const wheel=waterwheel(5.5,-8.6);
const clouds=[cloud(-6,-4),cloud(6,3),cloud(0,-12)];

/* ---- Field ---- */
const STEP=1.16;
const field=new THREE.Group();scene.add(field);
let plotObjs=[];
const G={ // shared geometries
 soil:new THREE.BoxGeometry(1,.16,1), furrow:new THREE.BoxGeometry(.86,.06,.17),
 sprout:new THREE.ConeGeometry(.05,.18,4), coin:new THREE.CylinderGeometry(.2,.2,.06,16),
 wheat:new THREE.CylinderGeometry(.13,.04,.5,6), wheatTop:new THREE.CylinderGeometry(.15,.13,.1,6),
 clover:new THREE.IcosahedronGeometry(.15,0), flower:new THREE.IcosahedronGeometry(.055,0),
 stalk:new THREE.CylinderGeometry(.035,.05,.95,5), leaf:new THREE.BoxGeometry(.04,.5,.12),
 cob:new THREE.CylinderGeometry(.065,.05,.24,6), tassel:new THREE.ConeGeometry(.06,.2,4),
 bush:new THREE.IcosahedronGeometry(.22,0), stake:new THREE.CylinderGeometry(.015,.015,.6,4),
 fruit:new THREE.SphereGeometry(.075,7,6), smallBush:new THREE.IcosahedronGeometry(.16,0),
 pod:new THREE.CylinderGeometry(.03,.03,.2,5), cane:new THREE.CylinderGeometry(.04,.045,1.3,5),
 caneLeaf:new THREE.ConeGeometry(.08,.7,4)
};
const SOIL_DRY=0xa8723c, SOIL_WET=0x6e4526, FURROW_DRY=0x8a5a2c, FURROW_WET=0x553419;
const pos9=[],pos4=[[-.22,-.22],[.22,-.22],[-.22,.22],[.22,.22]],pos6=[];
for(const z of[-.3,0,.3])for(const x of[-.3,0,.3])pos9.push([x,z]);
for(const z of[-.28,.28])for(const x of[-.3,0,.3])pos6.push([x,z]);

function buildCrop(id,stage){ // stage 0 sprout, 1 growing, 2 ripe
 const g=new THREE.Group();const ripe=stage===2;
 if(stage===0){pos6.forEach(([x,z])=>g.add(mesh(G.sprout,0x7cc242,x,.17,z,false)));return g}
 const k=ripe?1:.62;
 if(id==='wheat'){pos6.forEach(([x,z])=>{const c=ripe?0xe0b64a:0x8cc04a;g.add(mesh(G.wheat,c,x,.33,z));g.add(mesh(G.wheatTop,ripe?0xc99a2e:0x77a83c,x,.6,z,false))})}
 else if(id==='clover'){pos9.forEach(([x,z],i)=>{const m=mesh(G.clover,i%2?0x3e9e3e:0x4fb34a,x,.2,z);m.scale.y=.75;g.add(m);if(ripe&&i%2===0)g.add(mesh(G.flower,0xf2b8d8,x,.33,z,false))})}
 else if(id==='corn'){pos4.forEach(([x,z],i)=>{g.add(mesh(G.stalk,0x6aa84f,x,.55,z));
   const l1=mesh(G.leaf,0x5c9e3c,x+.08,.5,z);l1.rotation.z=-.7;g.add(l1);const l2=mesh(G.leaf,0x5c9e3c,x-.08,.7,z);l2.rotation.z=.7;g.add(l2);
   if(ripe){const cb=mesh(G.cob,0xf5c542,x+.07,.62,z+.04);cb.rotation.z=-.35;g.add(cb);g.add(mesh(G.tassel,0xc9a35a,x,1.1,z,false))}})}
 else if(id==='tomato'){pos4.forEach(([x,z])=>{g.add(mesh(G.stake,0x8b6a3e,x,.38,z,false));g.add(mesh(G.bush,0x3f8f3a,x,.4,z));
   if(ripe)[[.17,.35,0],[-.15,.42,.08],[0,.3,.18],[.05,.55,-.14]].forEach(([a,b,c])=>g.add(mesh(G.fruit,0xe53935,x+a,b,z+c,false)))})}
 else if(id==='bean'){pos6.forEach(([x,z])=>{const b=mesh(G.smallBush,0x5d9b3a,x,.22,z);b.scale.y=1.2;g.add(b);
   if(ripe){[-.1,.1].forEach(d=>{const p=mesh(G.pod,0x2e6b2a,x+d,.2,z+.13,false);p.rotation.z=.6*Math.sign(d);g.add(p)});g.add(mesh(G.flower,0xffffff,x,.42,z,false))}})}
 else if(id==='cane'){pos4.forEach(([x,z])=>{[[0,0],[.08,.06],[-.07,.05]].forEach(([a,b])=>{g.add(mesh(G.cane,ripe?0x8a4f6e:0x8fbf5a,x+a,.73,z+b))});
   for(let i=0;i<3;i++){const l=mesh(G.caneLeaf,0x5f9e3a,x,1.3,z);l.geometry=G.caneLeaf;l.rotation.set(.9,i*2.1,0,'YXZ');g.add(l)}})}
 if(!ripe)g.scale.set(1,k,1);
 return g}

function makeBar(){const g=new THREE.Group();
 const bg=new THREE.Mesh(new THREE.PlaneGeometry(.8,.12),new THREE.MeshBasicMaterial({color:0x2d1d0c,transparent:true,opacity:.55,depthTest:false}));
 const fg=new THREE.Mesh(new THREE.PlaneGeometry(.74,.07),new THREE.MeshBasicMaterial({color:0x9be15d,depthTest:false}));
 fg.geometry.translate(.37,0,0);fg.position.set(-.37,0,.001);bg.renderOrder=10;fg.renderOrder=11;g.add(bg);g.add(fg);g.userData.fg=fg;g.visible=false;return g}

function plotPos(i){const n=S.size,off=(n-1)*STEP/2;return new THREE.Vector3((i%n)*STEP-off,0,Math.floor(i/n)*STEP-off)}

function buildField(){
 while(field.children.length)field.remove(field.children[0]);
 plotObjs=[];const n=S.size,L=n*STEP+.4;
 // earth bed under the plots
 field.add(mesh(new THREE.BoxGeometry(L,.06,L),0x8a6236,0,.03,0,false));
 // low mud-brick border
 const half=L/2+.15;
 [[0,-half,L+.6,.3],[0,half,L+.6,.3],[-half,0,.3,L],[half,0,.3,L]].forEach(([x,z,w,d])=>field.add(mesh(new THREE.BoxGeometry(w,.12,d),0xb98a52,x,.06,z,false)));
 // wooden fence on outer edge
 const fh=half+.55,posts=[];
 for(let t=-fh;t<=fh+.01;t+=STEP*.75){posts.push([t,-fh],[t,fh],[-fh,t],[fh,t])}
 const pg=new THREE.BoxGeometry(.1,.55,.1);posts.forEach(([x,z])=>{if(Math.abs(x)<.9&&z>0)return;field.add(mesh(pg,0x9c6b3a,x,.27,z))});
 [[0,-fh,2*fh,.06],[-fh,0,.06,2*fh],[fh,0,.06,2*fh]].forEach(([x,z,w,d])=>{field.add(mesh(new THREE.BoxGeometry(w,.07,d),0xb07a42,x,.4,z));field.add(mesh(new THREE.BoxGeometry(w,.07,d),0xb07a42,x,.2,z))});
 [[-(fh+.9)/2,fh],[(fh+.9)/2,fh]].forEach(([x,z])=>{const w=fh-.9;field.add(mesh(new THREE.BoxGeometry(w,.07,.06),0xb07a42,x,.4,z));field.add(mesh(new THREE.BoxGeometry(w,.07,.06),0xb07a42,x,.2,z))});
 // dirt path from the gate
 const path=mesh(new THREE.BoxGeometry(1.4,.02,4),0xc9a46a,0,.01,fh+2,false);field.add(path);
 for(let i=0;i<n*n;i++){
  const g=new THREE.Group();g.position.copy(plotPos(i));g.userData.i=i;
  const soil=new THREE.Mesh(G.soil,new THREE.MeshLambertMaterial({color:SOIL_DRY,flatShading:true}));soil.position.y=.08;soil.receiveShadow=true;soil.castShadow=true;soil.userData.i=i;g.add(soil);
  const fm=new THREE.MeshLambertMaterial({color:FURROW_DRY,flatShading:true});
  [-.3,0,.3].forEach(z=>{const f=new THREE.Mesh(G.furrow,fm);f.position.set(0,.19,z);f.receiveShadow=true;f.userData.i=i;g.add(f)});
  const coin=new THREE.Mesh(G.coin,new THREE.MeshLambertMaterial({color:0xffc93c,emissive:0x664400}));coin.rotation.x=Math.PI/2;coin.position.y=1.45;coin.visible=false;coin.castShadow=true;g.add(coin);
  const bar=makeBar();bar.position.y=1.05;g.add(bar);
  field.add(g);plotObjs.push({g,soil,fm,coin,bar,crop:null,key:'',sel:false});
 }
 fitCamera();
}

/* ---- Camera framing (fits the field in the space between the HUD panels) ---- */
function fitCamera(){
 const W=app.clientWidth,H=app.clientHeight;renderer.setSize(W,H,false);
 const t=$('hudTop').offsetHeight+16,b=$('hudBot').offsetHeight+22;$('hint').style.bottom=(b-14)+'px';
 const L=S.size*STEP+1.6, hw=L*.72+.3, hh=L*.42+.7;
 const mid=Math.max(120,H-t-b);
 const upp=Math.max(2*hh/mid,2*hw/W)/zoom;
 cam.left=-W/2*upp;cam.right=W/2*upp;cam.top=(mid/2+t)*upp;cam.bottom=-(mid/2+b)*upp;
 cam.updateProjectionMatrix();cam.userData.upp=upp;placeCam()}
function placeCam(){cam.position.copy(target).add(CAM_OFF);cam.lookAt(target)}

/* ---- Input: tap to plant/harvest, drag to pan, pinch/wheel to zoom ---- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
const ptrs=new Map();let drag=null,pinch0=0,zoom0=1,moved=false;
cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===1){drag={x:e.clientX,y:e.clientY,t:target.clone()};moved=false}
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch0=Math.hypot(a.x-b.x,a.y-b.y);zoom0=zoom;moved=true}});
cv.addEventListener('pointermove',e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoom=Math.min(1.8,Math.max(.6,zoom0*d/pinch0));fitCamera();return}
 if(!drag)return;const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.hypot(dx,dy)>8)moved=true;if(!moved)return;
 const u=cam.userData.upp,r=new THREE.Vector3(1,0,-1).normalize(),f=new THREE.Vector3(-1,0,-1).normalize();
 target.copy(drag.t).addScaledVector(r,-dx*u).addScaledVector(f,dy*u/0.68);
 target.x=Math.max(-7,Math.min(7,target.x));target.z=Math.max(-7,Math.min(7,target.z));placeCam()});
function up(e){const had=ptrs.has(e.pointerId);ptrs.delete(e.pointerId);if(!had)return;
 if(ptrs.size===0){if(!moved)pick(e.clientX,e.clientY);drag=null}else{drag=null;moved=true}}
cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',up);
cv.addEventListener('wheel',e=>{e.preventDefault();zoom=Math.min(1.8,Math.max(.6,zoom*(e.deltaY<0?1.1:.9)));fitCamera()},{passive:false});
function pick(x,y){const r=cv.getBoundingClientRect();ndc.set((x-r.left)/r.width*2-1,-(y-r.top)/r.height*2+1);
 ray.setFromCamera(ndc,cam);const hits=ray.intersectObjects(field.children,true);
 for(const h of hits){let o=h.object;while(o&&o.userData.i===undefined)o=o.parent;if(o){tap(o.userData.i,x-r.left,y-r.top);return}}}

/* ================= GAME LOGIC ================= */
function toast(t){const el=$('toast');el.textContent=t;el.classList.add('show');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('show'),1600)}
function pop(txt,x,y){const p=document.createElement('div');p.className='pop';p.textContent=txt;p.style.left=x+'px';p.style.top=y+'px';app.appendChild(p);setTimeout(()=>p.remove(),1000)}
function screenOf(i){const v=plotPos(i);v.y=.6;v.project(cam);return{x:(v.x+1)/2*app.clientWidth,y:(1-v.y)/2*app.clientHeight}}
function newMission(){const ok=CROPS.filter(c=>c.lv<=S.lv);const c=ok[Math.floor(Math.random()*ok.length)];const n=3+S.lv;S.mission={crop:c.id,n,done:0,reward:Math.round(n*c.sell*1.5)}}
function addXp(a){S.xp+=a;while(S.xp>=need(S.lv)){S.xp-=need(S.lv);S.lv++;toast('🎉 مستوى '+S.lv+'! محاصيل جديدة اتفتحت')}}
function stage(p){if(!p)return null;const c=C[p.c];const el=(Date.now()-p.t)/1000;return{c,pr:Math.min(1,el/c.t),left:Math.max(0,Math.ceil(c.t-el))}}
function syncPlots(){
 plotObjs.forEach((o,i)=>{const p=S.plots[i],s=stage(p);
  const st=!s?-1:s.pr>=1?2:s.pr<.35?0:1;const key=p?p.c+st:'';
  if(key!==o.key){o.key=key;if(o.crop){o.g.remove(o.crop);o.crop=null}
   if(p){o.crop=buildCrop(p.c,st);o.crop.position.y=.16;o.g.add(o.crop)}
   o.soil.material.color.setHex(p?SOIL_WET:SOIL_DRY);o.fm.color.setHex(p?FURROW_WET:FURROW_DRY);
   o.coin.visible=st===2;if(st===2&&o.crop){o.crop.scale.set(.2,.2,.2);o.grow=0}}
  o.bar.visible=!!s&&s.pr<1;if(o.bar.visible)o.bar.userData.fg.scale.x=Math.max(.02,s.pr)})}
function renderTop(){$('coins').textContent=S.coins;$('lvl').textContent=S.lv;$('xpbar').style.width=(S.xp/need(S.lv)*100)+'%';
 const cost=expandCost();$('expand').textContent=S.size>=8?'الأرض كاملة ✅':'🚜 وسّع الأرض ('+cost+'🪙)';
 const m=S.mission;if(m){const c=C[m.crop];$('msg').innerHTML='طلب الحاج حمادة: احصد <b>'+m.n+' '+c.n+' '+c.e+'</b> ('+Math.min(m.done,m.n)+'/'+m.n+') والجايزة <b>'+m.reward+'🪙</b>';$('claim').className=m.done>=m.n?'on':''}}
function renderSeeds(){const b=$('seeds');b.innerHTML='';
 CROPS.forEach(c=>{const d=document.createElement('div');const lock=c.lv>S.lv;d.className='seed'+(S.sel===c.id?' sel':'')+(lock?' lock':'');d.tabIndex=0;
  d.innerHTML='<span class="e">'+(lock?'🔒':c.e)+'</span>'+c.n+'<br>'+(lock?'مستوى '+c.lv:c.cost+'🪙 · '+c.t+'ث');
  d.onclick=()=>{if(lock){toast('بتتفتح في مستوى '+c.lv);return}S.sel=c.id;save();renderSeeds()};b.appendChild(d)})}
function expandCost(){return 120*Math.pow(S.size-3,2)}
function tap(i,x,y){const p=S.plots[i];const o=plotObjs[i];o.bounce=1;
 if(!p){const c=C[S.sel];if(c.lv>S.lv)return toast('لسه مفتحتش');if(S.coins<c.cost)return toast('الفلوس مش كفاية 🪙');
  S.coins-=c.cost;S.plots[i]={c:c.id,t:Date.now()};pop('-'+c.cost+'🪙',x,y-20)}
 else{const s=stage(p);if(s.pr<1)return toast('باقي '+s.left+' ثانية '+s.c.e);harvest(i,{x,y})}
 after()}
function harvest(i,r){const p=S.plots[i];const c=C[p.c];S.plots[i]=null;S.coins+=c.sell;addXp(Math.max(1,Math.round(c.sell/3)));
 if(S.mission&&S.mission.crop===c.id)S.mission.done++;const q=r||screenOf(i);pop('+'+c.sell+'🪙',q.x,q.y-20)}
function after(){save();syncPlots();renderTop();renderSeeds()}
$('harvestAll').onclick=()=>{let n=0;for(let i=0;i<S.plots.length;i++){const p=S.plots[i];if(p&&stage(p).pr>=1){harvest(i,null);n++}}toast(n?'اتحصد '+n+' محصول 🧺':'مفيش حاجة جاهزة لسه');after()};
$('expand').onclick=()=>{if(S.size>=8)return;const c=expandCost();if(S.coins<c)return toast('محتاج '+c+' 🪙');S.coins-=c;const o=S.size,n=o+1,np=Array(n*n).fill(null);
 for(let y=0;y<o;y++)for(let x=0;x<o;x++)np[y*n+x]=S.plots[y*o+x];S.plots=np;S.size=n;buildField();toast('الأرض كبرت! 🌾');after()};
$('claim').onclick=()=>{const m=S.mission;if(m&&m.done>=m.n){S.coins+=m.reward;addXp(m.n*3);toast('تسلم إيدك! +'+m.reward+'🪙');newMission();after()}};

/* ================= LOOP ================= */
const reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
let last=performance.now(),acc=0;
function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;acc+=dt;
 if(acc>.4){acc=0;syncPlots()}
 const t=now/1000;
 plotObjs.forEach((o,i)=>{
  if(o.coin.visible){o.coin.rotation.z=t*3;o.coin.position.y=1.45+Math.sin(t*3+i)*.08}
  if(o.crop&&o.grow!==undefined&&o.grow<1){o.grow=Math.min(1,o.grow+dt*3);const s=.2+.8*(1-Math.pow(1-o.grow,3))+Math.sin(o.grow*Math.PI)*.15;o.crop.scale.set(s,s,s)}
  if(o.crop&&o.key.endsWith('2')&&!reduce)o.crop.rotation.z=Math.sin(t*1.6+i*.7)*.03;
  if(o.bounce){o.bounce=Math.max(0,o.bounce-dt*4);const s=1+Math.sin(o.bounce*Math.PI)*.08;o.g.scale.set(s,1,s)}
  if(o.bar.visible)o.bar.quaternion.copy(cam.quaternion)});
 if(!reduce){wheel.userData.wheel.rotation.z+=dt*.8;buff.position.y=Math.abs(Math.sin(t*1.2))*.02;
  clouds.forEach((c,k)=>{c.position.x+=dt*(.25+k*.08);if(c.position.x>18)c.position.x=-18});
  canalWater.material.color.setHSL(.55,.62,.6+Math.sin(t*1.5)*.02)}
 renderer.render(scene,cam);requestAnimationFrame(loop)}

if(!S.mission)newMission();
renderTop();renderSeeds();buildField();syncPlots();
window.addEventListener('resize',fitCamera);
if(window.ResizeObserver)new ResizeObserver(fitCamera).observe(app);
setTimeout(()=>{$('hint').style.transition='opacity 1s';$('hint').style.opacity=0},6000);
requestAnimationFrame(loop);
</script>
